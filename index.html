<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ===== FACEBOOK OPEN GRAPH TAGS ===== -->
    <meta property="og:title" content="LinkPro - Professional Link Generator" />
    <meta property="og:description" content="Generate professional links with images for Facebook. Share instantly!" />
    <meta property="og:image" content="https://mrking507.github.io/linkpro-project/frontend/images/logo.jpg" />
    <meta property="og:url" content="https://mrking507.github.io/linkpro-project/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinkPro" />
    <meta property="og:locale" content="en_US" />
    
    <!-- ===== TWITTER CARD ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinkPro - Professional Link Generator" />
    <meta name="twitter:description" content="Generate professional links with images for Facebook" />
    <meta name="twitter:image" content="https://mrking507.github.io/linkpro-project/frontend/images/logo.jpg" />
    
    <title>LinkPro - Professional Link Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        /* Quick Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0e1a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 800px; width: 100%; padding: 20px; }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border-radius: 24px; padding: 40px; border: 1px solid rgba(255,255,255,0.08); }
        h1 { font-size: 32px; text-align: center; margin-bottom: 8px; }
        h1 span { color: #6c63ff; }
        .subtitle { text-align: center; color: rgba(255,255,255,0.4); margin-bottom: 30px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #6c63ff; background: rgba(255,255,255,0.08); }
        .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #6c63ff, #4a3db8); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 8px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(108,99,255,0.3); }
        .result { margin-top: 24px; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); display: none; }
        .result.active { display: block; }
        .result .link-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .result .link-box input { flex: 1; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; color: #6c63ff; font-size: 14px; outline: none; }
        .result .link-box button { padding: 10px 20px; background: #6c63ff; border: none; border-radius: 8px; color: #fff; cursor: pointer; }
        .result .link-box button:hover { background: #5a4bd1; }
        .fb-preview { margin-top: 16px; padding: 16px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.04); }
        .fb-preview img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 8px; }
        .fb-preview .fb-title { color: #6c63ff; font-size: 18px; font-weight: 600; }
        .fb-preview .fb-desc { color: rgba(255,255,255,0.4); font-size: 14px; }
        .fb-preview .fb-url { color: rgba(255,255,255,0.2); font-size: 12px; }
        .fb-share-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px; background: #1877f2; border: none; border-radius: 8px; color: #fff; font-size: 14px; cursor: pointer; text-decoration: none; margin-top: 12px; }
        .fb-share-btn:hover { background: #0d6ad0; }
        .preview-img { margin-top: 8px; max-width: 100%; max-height: 150px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Link<span>Pro</span></h1>
        <p class="subtitle">Generate Facebook-ready links with images</p>
        
        <!-- Input Form -->
        <div class="input-group">
            <label><i class="fas fa-link"></i> Enter URL</label>
            <input type="url" id="urlInput" placeholder="https://example.com" />
        </div>
        <div class="input-group">
            <label><i class="fas fa-image"></i> Image URL</label>
            <input type="url" id="imageInput" placeholder="https://example.com/image.jpg" />
        </div>
        
        <button class="btn" onclick="generateLink()">
            <i class="fas fa-wand-magic-sparkles"></i> Generate Facebook Link
        </button>
        
        <!-- Result -->
        <div class="result" id="result">
            <h4 style="color: rgba(255,255,255,0.6); margin-bottom: 12px;">
                <i class="fas fa-check-circle" style="color: #00b894;"></i> Your Facebook-Ready Link
            </h4>
            <div class="link-box">
                <input type="text" id="generatedLink" readonly />
                <button onclick="copyLink()"><i class="fas fa-copy"></i> Copy</button>
            </div>
            
            <!-- Facebook Preview -->
            <div class="fb-preview">
                <p style="color: rgba(255,255,255,0.2); font-size: 12px; margin-bottom: 8px;">
                    <i class="fab fa-facebook" style="color: #1877f2;"></i> Facebook Preview
                </p>
                <div class="fb-title" id="fbTitle">Your Title Here</div>
                <div class="fb-desc" id="fbDesc">Your description will appear here</div>
                <div class="fb-url" id="fbUrl">https://your-link.com</div>
                <img id="fbImage" src="" alt="Preview" class="preview-img" style="display:none;" />
            </div>
            
            <!-- Share Buttons -->
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px;">
                <a href="#" target="_blank" class="fb-share-btn" id="fbShareBtn">
                    <i class="fab fa-facebook"></i> Share on Facebook
                </a>
                <button onclick="resetForm()" style="padding: 10px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; color: rgba(255,255,255,0.4); cursor: pointer;">
                    <i class="fas fa-eraser"></i> Clear
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================
// 1️⃣ GENERATE LINK
// ============================================
function generateLink() {
    const urlInput = document.getElementById('urlInput');
    const imageInput = document.getElementById('imageInput');
    const resultDiv = document.getElementById('result');
    
    let url = urlInput.value.trim();
    const image = imageInput.value.trim();
    
    if (!url || !image) {
        alert('⚠️ Please enter both URL and Image URL');
        return;
    }
    
    // Add https if missing
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
    }
    
    // Generate unique ID
    const uniqueId = Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
    const generatedUrl = `https://mrking507.github.io/linkpro-project/share/${uniqueId}`;
    
    // Show result
    resultDiv.classList.add('active');
    document.getElementById('generatedLink').value = generatedUrl;
    
    // Update Facebook Preview
    document.getElementById('fbTitle').textContent = 'Check out this link!';
    document.getElementById('fbDesc').textContent = 'Visit this amazing link from LinkPro';
    document.getElementById('fbUrl').textContent = url;
    
    const fbImage = document.getElementById('fbImage');
    fbImage.src = image;
    fbImage.style.display = 'block';
    fbImage.onerror = function() { this.style.display = 'none'; };
    
    // Update Facebook Share Button
    const shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(generatedUrl)}&quote=Check%20out%20this%20link!`;
    document.getElementById('fbShareBtn').href = shareUrl;
    
    // Save to history
    saveToHistory(url, image, generatedUrl);
}

// ============================================
// 2️⃣ COPY LINK
// ============================================
function copyLink() {
    const link = document.getElementById('generatedLink');
    link.select();
    document.execCommand('copy');
    
    const btn = document.querySelector('.link-box button');
    const original = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
    btn.style.background = '#00b894';
    setTimeout(() => {
        btn.innerHTML = original;
        btn.style.background = '#6c63ff';
    }, 2000);
}

// ============================================
// 3️⃣ RESET
// ============================================
function resetForm() {
    document.getElementById('urlInput').value = '';
    document.getElementById('imageInput').value = '';
    document.getElementById('result').classList.remove('active');
}

// ============================================
// 4️⃣ HISTORY (Local Storage)
// ============================================
function saveToHistory(url, image, generatedUrl) {
    let history = JSON.parse(localStorage.getItem('linkHistory') || '[]');
    history.unshift({
        url: url,
        image: image,
        generatedUrl: generatedUrl,
        timestamp: new Date().toLocaleString()
    });
    if (history.length > 10) history.pop();
    localStorage.setItem('linkHistory', JSON.stringify(history));
}

// ============================================
// 5️⃣ LOAD HISTORY
// ============================================
function loadHistory() {
    const history = JSON.parse(localStorage.getItem('linkHistory') || '[]');
    // You can display history anywhere
    console.log('History:', history);
}

// ============================================
// 6️⃣ KEYBOARD SHORTCUT
// ============================================
document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        generateLink();
    }
});

console.log('🚀 LinkPro Facebook Link Generator loaded!');
console.log('💡 Shortcut: Ctrl+Enter to generate');
</script>

</body>
</html>
