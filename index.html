<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sikander Baloch - ShortLink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🔐 SECRET KEY MODAL -->
    <div id="keyModal" class="key-modal">
        <div class="key-box">
            <div class="key-icon">🔐</div>
            <h2>Sikander Baloch</h2>
            <p>Yeh website protected hai. Secret key daalein.</p>
            <input type="password" id="secretKeyInput" placeholder="Enter secret key..." autocomplete="off">
            <button onclick="checkSecretKey()">Unlock</button>
            <p id="keyError" class="key-error"></p>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="mainContent" style="display:none;">
        <nav>
            <div class="logo">🔗 Sikander Baloch</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </nav>

        <section class="hero">
            <h1>Shorten Your Long URLs</h1>
            <p>Paste your link below and get a short one instantly</p>

            <div class="shorten-box">
                <input type="url" id="urlInput" placeholder="https://example.com/very/long/link/here">
                <button onclick="shortenUrl()">Shorten</button>
            </div>

            <div id="result" class="result"></div>
        </section>

        <footer>
            <p>© 2026 <strong>Sikander Baloch</strong> — All Rights Reserved</p>
            <p class="footer-sub">Professional URL Shortener Service</p>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        checkAuth();
    </script>
</body>
</html>
